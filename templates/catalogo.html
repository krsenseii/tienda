<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Oficial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .img-container {
            width: 100%; aspect-ratio: 1 / 1; background-color: #f8f9fa;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-radius: 5px 5px 0 0; position: relative;
        }
        .card-img-top { width: 100%; height: 100%; object-fit: contain; padding: 10px; transition: transform 0.3s ease; }
        .card:hover .card-img-top { transform: scale(1.05); }
        .cart-float { position: fixed; bottom: 20px; right: 20px; z-index: 1000; width: 60px; height: 60px; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        /* BARRA CATEGORÍAS MEJORADA */
        .contenedor-scroll-padre { 
            width: 100%; 
            overflow: hidden; 
            margin-bottom: 20px;
        }
        .scroll-categorias {
            display: flex; 
            flex-wrap: nowrap; 
            overflow-x: auto; 
            gap: 8px;
            padding: 5px 2px 10px 2px; 
            justify-content: flex-start;
            -webkit-overflow-scrolling: touch; /* Suavidad en móvil */
            scrollbar-width: none; 
            cursor: grab;
        }
        .scroll-categorias::-webkit-scrollbar { display: none; }
        .scroll-categorias .btn { 
            flex: 0 0 auto; /* Importante para que no se aplasten */
            white-space: nowrap; 
            border-radius: 20px;
            padding-left: 15px;
            padding-right: 15px;
        }
        
        .filtro-activo { background-color: #212529 !important; color: white !important; border-color: #212529 !important; }
        .card { border: none; transition: box-shadow 0.3s; }
        .card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.1) !important; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="text-center fw-bold mb-4">⚽ CATÁLOGO OFICIAL</h1>
    
    <div class="row mb-4 justify-content-center">
        <div class="col-md-6 col-10">
            <div class="input-group input-group-lg">
                <span class="input-group-text bg-white border-end-0">🔍</span>
                <input type="text" id="buscador" class="form-control border-start-0" placeholder="Buscar equipo...">
            </div>
        </div>
    </div>

    <div class="contenedor-scroll-padre">
        <div class="scroll-categorias" id="barra-categorias">
            <button class="btn btn-outline-secondary filtro-btn filtro-activo" onclick="filtrarCategoria('todas', this)">Todo</button>
            {% for cat in categorias %}
            <button class="btn btn-outline-secondary filtro-btn" onclick="filtrarCategoria('{{ cat }}', this)">{{ cat }}</button>
            {% endfor %}
        </div>
    </div>
    
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" id="grid-productos">
        {% for p in productos %}
        <div class="col producto-item" data-nombre="{{ p.nombre | lower }}" data-categoria="{{ p.categoria | lower }}">
            <div class="card h-100 shadow-sm">
                <div class="img-container">
                    <img src="/fotos/{{ p.ruta_web }}" class="card-img-top" alt="{{ p.nombre }}" loading="lazy">
                    <span class="badge bg-dark position-absolute top-0 start-0 m-2 opacity-75">{{ p.categoria }}</span>
                </div>
                
                <div class="card-body p-3 d-flex flex-column">
                    <h6 class="card-title fw-bold text-truncate">{{ p.nombre }}</h6>
                    
                    <div class="mt-auto">
                        <div class="mb-2">
                            {% if p.es_bebe %}
                                <input type="hidden" id="talla-{{ loop.index }}" value="SIN TALLA">
                                <span class="badge bg-info text-dark w-100">Bebé (Set)</span>
                            {% elif p.es_nino %}
                                <select class="form-select form-select-sm" id="talla-{{ loop.index }}">
                                    <option value="16">16 (3-4 años)</option><option value="18">18 (4-5 años)</option>
                                    <option value="20">20 (5-6 años)</option><option value="22">22 (7-8 años)</option>
                                    <option value="24">24 (9-10 años)</option><option value="26">26 (11-12 años)</option>
                                    <option value="28">28 (13-14 años)</option>
                                </select>
                            {% else %}
                                <select class="form-select form-select-sm" id="talla-{{ loop.index }}">
                                    <option value="S">S</option><option value="M" selected>M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option>
                                </select>
                            {% endif %}
                        </div>
                        
                        {% if p.personalizable %}
                        <div class="mb-2">
                            <input type="text" class="form-control form-control-sm" id="dorsal-{{ loop.index }}" placeholder="Nombre y Nº">
                        </div>
                        {% else %}
                        <input type="hidden" id="dorsal-{{ loop.index }}" value="">
                        {% endif %}

                        <button class="btn btn-dark w-100 btn-sm py-2 fw-bold" 
                                onclick="agregarAlCarrito('{{ p.nombre }}', '{{ p.ruta_web }}', '{{ p.categoria_original }}', {{ loop.index }})">
                            AÑADIR +
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<button class="btn btn-primary rounded-circle cart-float" data-bs-toggle="modal" data-bs-target="#modalCarrito">
    🛒 <span id="contador-carrito" class="badge bg-danger rounded-pill badge-cart">0</span>
</button>

<div class="modal fade" id="modalCarrito" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">🛒 Tu Pedido</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul id="lista-carrito" class="list-group list-group-flush mb-3"></ul>
                <div class="d-flex justify-content-between align-items-center border-top pt-3 mb-3">
                    <h4>Total:</h4><h3 class="fw-bold text-primary"><span id="total-precio">0</span> €</h3>
                </div>
                <div class="alert alert-light border">
                    <label class="form-label fw-bold">📱 Usuario (Telegram/Instagram) o Teléfono:</label>
                    <input type="text" id="contacto-cliente" class="form-control" placeholder="@usuario o número">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir mirando</button>
                <button type="button" class="btn btn-success fw-bold px-4" onclick="enviarPedido()">✅ ENVIAR PEDIDO</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- LÓGICA FILTROS Y CARRITO ---
    const buscador = document.getElementById('buscador');
    const items = document.querySelectorAll('.producto-item');
    let categoriaActual = 'todas';
    let carrito = [];

    // Scroll con arrastre para PC en la barra de categorías
    const slider = document.querySelector('.scroll-categorias');
    let isDown = false; let startX; let scrollLeft;
    slider.addEventListener('mousedown', (e) => { isDown = true; slider.style.cursor = 'grabbing'; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
    slider.addEventListener('mouseleave', () => { isDown = false; slider.style.cursor = 'grab'; });
    slider.addEventListener('mouseup', () => { isDown = false; slider.style.cursor = 'grab'; });
    slider.addEventListener('mousemove', (e) => { if(!isDown) return; e.preventDefault(); const x = e.pageX - slider.offsetLeft; const walk = (x - startX) * 2; slider.scrollLeft = scrollLeft - walk; });

    if (buscador) { buscador.addEventListener('keyup', (e) => { aplicarFiltros(e.target.value.toLowerCase(), categoriaActual); }); }

    function filtrarCategoria(cat, btn) {
        categoriaActual = cat.toLowerCase(); // Convertimos a minúsculas para comparar
        
        // Gestión visual botones
        document.querySelectorAll('.filtro-btn').forEach(b => { b.classList.remove('filtro-activo'); b.classList.add('btn-outline-secondary'); });
        if(btn) { 
            btn.classList.add('filtro-activo'); 
            btn.classList.remove('btn-outline-secondary'); 
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); 
        }
        
        aplicarFiltros(buscador ? buscador.value.toLowerCase() : '', categoriaActual);
    }

    function aplicarFiltros(texto, categoria) {
        items.forEach(item => {
            const nombre = item.getAttribute('data-nombre') || '';
            const catItem = item.getAttribute('data-categoria') || ''; // Esto viene en minúsculas desde el HTML
            
            // Lógica: Coincidir texto Y (ser 'todas' O que la categoría incluya la palabra seleccionada)
            // Usamos .includes() para que "LaLiga" coincida con "laliga"
            const coincideCategoria = categoria === 'todas' || catItem.includes(categoria);
            
            if (nombre.includes(texto) && coincideCategoria) { 
                item.classList.remove('d-none'); 
            } else { 
                item.classList.add('d-none'); 
            }
        });
    }

    function obtenerPrecio(categoriaRaw, personalizada) {
        const cat = String(categoriaRaw).toLowerCase().trim();
        
        // --- PRECIOS NUEVOS Y ACTUALIZADOS ---
        // Asumo que a la versión Player le sumas 3€ si le ponen nombre (como a las normales), si no, pon solo "return 24;"
        if (cat.includes('player')) return personalizada ? 27 : 24; 
        if (cat.includes('pantalon')) return 16;
        
        // --- PRECIOS ANTIGUOS QUE MANTIENES ---
        if (cat.includes('combo')) return 50;
        if (cat.includes('retro')) return personalizada ? 30 : 27;
        if (cat.includes('nba')) return 26;
        if (cat.includes('niño') || cat.includes('bebe') || cat.includes('kid')) return 25;
        if (cat.includes('entrenam') || cat.includes('chandal')) return 50;
        if (cat.includes('sudadera')) return 25;
        if (cat.includes('media')) return 8;

        // --- PRECIOS MODIFICADOS ---
        if (cat.includes('abrigo') || cat.includes('chaqueta')) return 40; // Antes 50€
        if (cat.includes('motor') || cat.includes('f1')) return 28; // Antes 25€
        
        // Precio base para el resto de cosas que no coincidan arriba
        return personalizada ? 21 : 18;
    }

    function agregarAlCarrito(nombre, rutaWeb, categoria, indice) {
        try {
            let talla = 'Única';
            const selectTalla = document.getElementById('talla-' + indice);
            if (selectTalla) talla = selectTalla.value;

            let dorsalTexto = ''; let esPersonalizada = false;
            const inputDorsal = document.getElementById('dorsal-' + indice);
            if (inputDorsal) { dorsalTexto = inputDorsal.value.trim(); if (dorsalTexto.length > 0) esPersonalizada = true; }

            const precioFinal = obtenerPrecio(categoria, esPersonalizada);

            carrito.push({
                id: Date.now(),
                nombre: nombre,
                categoria: categoria,
                ruta_web: rutaWeb,
                talla: talla,
                dorsal: dorsalTexto,
                personalizada: esPersonalizada,
                precio: precioFinal
            });
            renderizarCarrito();
        } catch (error) { alert("Error: " + error.message); }
    }

    function renderizarCarrito() {
        const lista = document.getElementById('lista-carrito');
        const contador = document.getElementById('contador-carrito');
        const totalElem = document.getElementById('total-precio');
        if (!lista) return;
        lista.innerHTML = ''; let total = 0;
        if (carrito.length === 0) { lista.innerHTML = '<li class="list-group-item text-center text-muted">Vacío</li>'; } else {
            carrito.forEach(p => {
                total += p.precio;
                let detalles = `Talla: <strong>${p.talla}</strong>`;
                if (p.personalizada) detalles += ` | Dorsal: <strong>${p.dorsal}</strong>`;
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `<div class="ms-2 me-auto"><div class="fw-bold">${p.nombre}</div><small class="text-muted">${detalles}</small></div><div class="text-end"><span class="fw-bold d-block text-primary">${p.precio}€</span><button class="btn btn-sm text-danger border-0" onclick="eliminarDelCarrito(${p.id})">✕</button></div>`;
                lista.appendChild(li);
            });
        }
        if (contador) contador.innerText = carrito.length;
        if (totalElem) totalElem.innerText = total;
    }

    function eliminarDelCarrito(id) { carrito = carrito.filter(p => p.id !== id); renderizarCarrito(); }

    function enviarPedido() {
        const contacto = document.getElementById('contacto-cliente').value;
        if(carrito.length === 0) return alert("El carrito está vacío");
        if(!contacto) return alert("Por favor escribe tu usuario de Telegram, \nInstagram o telefono para contactarte");

        const btn = document.querySelector('.modal-footer .btn-success');
        const textoOriginal = btn.innerText;
        btn.innerText = "Enviando...";
        btn.disabled = true;

        fetch('/procesar_pedido', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contacto: contacto, carrito: carrito })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'ok') {
                alert("¡Pedido enviado! ✅\nTe contactaremos pronto.");
                carrito = [];
                renderizarCarrito();
                document.getElementById('contacto-cliente').value = '';
                const modal = bootstrap.Modal.getInstance(document.getElementById('modalCarrito'));
                modal.hide();
            } else {
                alert("Error al enviar. Inténtalo de nuevo.");
            }
        })
        .catch(err => {
            console.error(err);
            alert("Error de conexión.");
        })
        .finally(() => {
            btn.innerText = textoOriginal;
            btn.disabled = false;
        });
    }
</script>
</body>
</html>
